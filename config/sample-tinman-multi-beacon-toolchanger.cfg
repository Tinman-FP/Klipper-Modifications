# Sample first-pass multi-Beacon toolchanger layout for the Tinman fork.
#
# Update serials, offsets, and mesh/probe settings to match the machine.

[beacon sensor t0]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_123456789-if00
x_offset: 0
y_offset: 24
mesh_main_direction: x
mesh_runs: 2
home_xy_position: 125, 110
register_as_probe: True

[beacon sensor t1]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_987654321-if00
x_offset: 0
y_offset: -24
mesh_main_direction: x
mesh_runs: 2
home_xy_position: 125, 110
register_as_probe: True

[safe_z_home]
home_xy_position: 125, 110
z_hop: 10

[gcode_macro T0]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    BEACON_SELECT SENSOR=t0

[gcode_macro T1]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    BEACON_SELECT SENSOR=t1

[gcode_macro PROBE_ACTIVE_TOOL]
description: Probe using whichever Beacon is active
gcode:
    BEACON_STATUS
    PROBE
